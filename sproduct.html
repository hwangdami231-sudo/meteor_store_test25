<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <title>Meteor Store - Chi tiết sản phẩm</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="header">
        <a href="index.html"><img src="img/logo4.png" class="logo"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a class="active" href="shop.html">Shop</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="login.html">Login</a></li>
                <li id="lg-bag"><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a></li>
                <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>
            </ul>
        </div>
        <div id="mobile">
            <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
            <i id="bar" class="fas fa-outdent"></i>
        </div>
    </section>

    <!-- Single Product Details Container -->
    <section id="prodetails" class="section-p1">
        <div class="single-pro-image">
        </div>
        <div class="single-pro-details">
            <h6 id="sp-category">Home / Category</h6>
            <h4 id="sp-name">Tên Sản Phẩm</h4>
            <h2 id="sp-price">$0</h2>
            <select id="sp-size">
                <option>Chọn Size</option>
                <option>S</option>
                <option>M</option>
                <option>L</option>
                <option>XL</option>
            </select>
            <input type="number" value="1" min="1" id="sp-qty">
            <button class="normal" id="sp-add-to-cart" data-id="">THÊM VÀO GIỎ HÀNG</button>
            <h4>Chi tiết sản phẩm</h4>
            <span id="sp-desc">Mô tả sản phẩm sẽ được tải vào đây...</span>
        </div>
    </section>

    <!--Footer-->
    <footer id="section-p1">
        <div class="col">
            <img src="img/logo2.png" alt="">
            <h4><strong>THÔNG TIN LIÊN HỆ</strong></h4>
            <p><strong>SỐ CSKH:</strong> 0123456789 (8h - 22h)</p>
            <p><strong>FOR BUSINESS:</strong> contact@meteor.vn</p>
            <p><strong>WEBSITE:</strong> meteor.vn</p>
            <div class="follow">
                <h4><strong>FOLLOW US</strong></h4>
                <div class="icon">
                    <i class="fab fa-facebook-f"></i>
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
