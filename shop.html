<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <title>Meteor Store</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="header">
        <a href="index.html"><img src="img/logo4.png" class="logo"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a class="active" href="shop.html">Shop</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="login.html">Login</a></li>
                <li id="lg-bag"><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a></li>
                <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>
            </ul>
        </div>
        <div id="mobile">
            <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
            <i id="bar" class="fas fa-outdent"></i>
        </div>
    </section>

    <!--Home page-->
    <section id="page-header">
    </section>
    <!--Product-->
    <section id="product1" class="section-p1">
        <div id="filter-bar">
            <div>
                <label for="category-filter">Danh mục:</label>
                <select id="category-filter">
                    <option value="All">Tất cả</option>
                    <option value="T-shirt">T-shirt</option>
                    <option value="Pants">Pants</option>
                    <option value="Hoodie">Hoodie</option>
                    <option value="Outerwear">Outerwear</option>
                    <option value="Shoes">Shoes</option>
                </select>
            </div>
            <div>
                <label for="price-filter">Giá:</label>
                <select id="price-filter">
                    <option value="Default">Mặc định</option>
                    <option value="LowToHigh">Thấp đến Cao</option>
                    <option value="HighToLow">Cao xuống Thấp</option>
                </select>
            </div>
        </div>
        <div class="pro-container" id="shop-product-container">
            <!-- Products will be loaded here dynamically by script.js -->
        </div>
    </section>
    <!--PhanTrang-->
    <section id="pagination" class="section-p1">
        <!-- Pagination updated dynamically by script.js -->
    </section>
    <!--Footer-->
    <footer id="section-p1">
        <div class="col">
            <img src="img/logo4.png" alt="">
            <h4><strong>THÔNG TIN LIÊN HỆ</strong></h4>
            <p><strong>SỐ CSKH:</strong> 0123456789 (8h - 22h)</p>
            <p><strong>FOR BUSINESS:</strong> contact@meteor.vn</p>
            <p><strong>WEBSITE:</strong> meteor.vn</p>
            <div class="follow">
                <h4><strong>FOLLOW US</strong></h4>
                <div class="icon">
                    <i class="fab fa-facebook-f"></i>
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
