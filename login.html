<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.2.0/css/all.min.css">
    <title>Meteor Store - Cổng Không Gian</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <section id="header">
        <a href="index.html"><img src="img/logo4.png" class="logo"></a>
        <div>
            <ul id="navbar">
                <li><a href="index.html">Home</a></li>
                <li><a href="shop.html">Shop</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a class="active" href="login.html">Login</a></li>
                <li id="lg-bag"><a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a></li>
                <a href="#" id="close"><i class="fa-solid fa-xmark"></i></a>
            </ul>
        </div>
        <div id="mobile">
            <a href="cart.html"><i class="fa-solid fa-cart-shopping"></i></a>
            <i id="bar" class="fas fa-outdent"></i>
        </div>
    </section>

    <!-- Auth Section -->
    <section id="auth-section" class="section-p1">
        <div class="auth-container">
            <!-- Đăng nhập -->
            <div id="login-box">
                <h2>ĐĂNG NHẬP</h2>
                <form id="form-login">
                    <input type="email" id="login-email" placeholder="Nhập Email của bạn" required>
                    <input type="password" id="login-password" placeholder="Mật khẩu truy cập" required>
                    <button type="submit" class="normal">Khởi Động</button>
                    <p>Phi hành gia mới? <a href="#" id="go-to-register">Gia nhập trạm không gian</a></p>
                </form>
            </div>

            <!-- Đăng ký -->
            <div id="register-box" class="hidden">
                <h2>ĐĂNG KÝ MỚI</h2>
                <form id="form-register">
                    <input type="text" id="reg-user" placeholder="Định danh (Username)" required>
                    <input type="email" id="reg-email" placeholder="Email liên lạc" required>
                    <input type="password" id="reg-password" placeholder="Mật khẩu bảo mật" required>
                    <button type="submit" class="normal">Kích Hoạt Tài Khoản</button>
                    <p>Đã có mã truy cập? <a href="#" id="go-to-login">Thực hiện đăng nhập</a></p>
                </form>
            </div>
        </div>
    </section>

    <!--Footer-->
    <footer id="section-p1">
        <div class="col">
            <img src="img/logo2.png" alt="">
            <h4><strong>THÔNG TIN LIÊN HỆ</strong></h4>
            <p><strong>SỐ CSKH:</strong> 0123456789 (8h - 22h)</p>
            <p><strong>FOR BUSINESS:</strong> contact@meteor.vn</p>
            <p><strong>WEBSITE:</strong> meteor.vn</p>
            <div class="follow">
                <h4><strong>FOLLOW US</strong></h4>
                <div class="icon">
                    <i class="fab fa-facebook-f"></i>
                    <i class="fab fa-instagram"></i>
                </div>
            </div>
        </div>
    </footer>
    <script src="script.js"></script>
</body>

</html>
